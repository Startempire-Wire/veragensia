# Veragensia Omarchy public demo — Hyprland nested in the capture compositor + Waybar presenter.
# Derived from the pinned Omarchy revision structure (hypr/ + waybar presenter);
# public-safe: no Focusa daemon connection, no private state, no credentials.
#
# NOTE (demo host only): the image carries two Aquamarine build-time patches
# (see docker/omarchy-demo/patch-aquamarine.py and docs/202). The startup script
# sets AQ_PRESENT_SHM=1 so output frames are presented as shared-memory buffers
# (required on GPU-less hosts where the capture compositor cannot import
# dmabufs). On a native install (Chromebook i915) neither patch nor env is
# needed — run Omarchy as upstream intends.

# Nested output sized for the public stream window.
monitor = ,1280x760@60,auto,1

# Presenter: Waybar renders the dated public Work snapshot (public-safe).
exec-once = waybar -c /veragensia/docker/omarchy-demo/overlay/waybar/config.jsonc -s /veragensia/docker/omarchy-demo/overlay/waybar/style.css

# Consumer: Focusa Chrome extension start page (identical flags/mount path = identical extension identity).
# Ozone platform pinned to Wayland under Hyprland; no URL argument so the default
# new tab renders the public Work view (public-newtab build).
exec-once = /usr/lib/chromium/chromium --show-component-extension-options --enable-gpu-rasterization --no-default-browser-check --disable-pings --media-router=0 --disable-dev-shm-usage --enable-remote-extensions --no-sandbox --ozone-platform=wayland --user-data-dir=/config/.config/chromium-uiai --load-extension=/extroot/dist --disable-extensions-except=/extroot/dist --remote-debugging-port=9333 --remote-debugging-address=127.0.0.1 --no-first-run --no-default-browser-check --window-size=1280,760 --window-position=150,90

# Terminal for operator-side diagnostics (public demo only).
exec-once = foot

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c4b5fdee) rgba(8b7ec8ee) 45deg
    col.inactive_border = rgba(3a3550aa)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = true
    bezier = veragens,0.05,0.9,0.1,1.05
    animation = windows,1,4,veragens,slide
    animation = fade,1,6,default
}

dwindle {
    preserve_split = true
}
