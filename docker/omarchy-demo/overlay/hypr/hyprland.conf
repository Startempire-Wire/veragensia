# Veragensia Omarchy public demo — Hyprland nested in the capture compositor + Waybar presenter.
# Derived from the pinned Omarchy revision structure (hypr/ + waybar presenter);
# public-safe: no Focusa daemon connection, no private state, no credentials.
#
# NOTE (demo host only): the image carries two Aquamarine build-time patches
# (see docker/omarchy-demo/patch-aquamarine.py and docs/202). The startup script
# sets AQ_PRESENT_SHM=1 so output frames are presented as shared-memory buffers
# (required on GPU-less hosts where the capture compositor cannot import
# dmabufs). On a native install (Chromebook i915) neither patch nor env is
# needed — run Omarchy as upstream intends.

# Nested output sized for the public stream window.
monitor = ,1280x760@60,auto,1

# Presenter: Waybar renders the dated public Work snapshot (public-safe).
# Presenter: Waybar renders the dated public Work snapshot (public-safe).
# Wallpaper: swaybg with the generated Veragensia art (swaybg reads the image
# directly — no per-daemon config to maintain).
exec-once = swaybg -i /veragensia/docker/omarchy-demo/overlay/hypr/veragensia-wallpaper.png -m fill
exec-once = waybar -c /veragensia/docker/omarchy-demo/overlay/waybar/config.jsonc -s /veragensia/docker/omarchy-demo/overlay/waybar/style.css

# Consumer: Focusa Chrome extension start page (identical flags/mount path = identical extension identity).
# Ozone platform pinned to Wayland under Hyprland; no URL argument so the default
# new tab renders the public Work view (public-newtab build).
# Consumer: Focusa Chrome extension start page via the self-healing supervisor
# (identical flags/mount path = identical extension identity on every relaunch).
# Ozone platform pinned to Wayland under Hyprland; no URL argument so the default
# new tab renders the public Work view (public-newtab build).
exec-once = /veragensia/docker/omarchy-demo/overlay/webtop/chromium-loop.sh

# Mobile readability: Chromium renders its UI and pages at 1.25x so text and
# controls stay legible when a phone scales the 1280-wide desktop down.

# Demo keymap: full primitive Omarchy-parity set. Every dispatcher maps to
# exactly one S2 semantic operation (invariant 2: identity is chord-independent),
# and the V201-S3 compiler classifies the whole live keymap. Voice uses the same
# operations — the chords are the human floor, not the agent's dependency.
bind = SUPER, Return, exec, foot -c /veragensia/docker/omarchy-demo/overlay/hypr/foot.ini
# Window lifecycle and layout.
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, T, togglesplit
bind = SUPER SHIFT, Q, exit
# Focus movement: one operation, four chords.
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
# Move the active window between tiles: one operation, four chords.
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
# Resize the active window: one operation, four chords.
binde = SUPER CTRL, left, resizeactive, -40 0
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, up, resizeactive, 0 -40
binde = SUPER CTRL, down, resizeactive, 0 40
# Workspaces 1-9 plus window-to-workspace moves.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
# Scratchpad-style special workspace.
bind = SUPER, S, togglespecialworkspace, magic

# Terminal for operator-side diagnostics (public demo only). Larger font for
# phone-sized viewports (see overlay/hypr/foot.ini).
exec-once = foot -c /veragensia/docker/omarchy-demo/overlay/hypr/foot.ini

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c4b5fdee) rgba(8b7ec8ee) 45deg
    col.inactive_border = rgba(3a3550aa)
    layout = dwindle
}

# Mobile readability: scale the whole consumer surface up so text stays legible
# when a phone scales the 1280-wide desktop to its viewport.
exec-once = hyprctl setcursor Nordizer-Symphony 24 2>/dev/null || true

decoration {
    rounding = 6
    # Blur and shadows are disabled: on the software-rendered demo host they cost
    # real CPU per frame and smear the stream during layout changes. The native
    # Chromebook install can re-enable them freely.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    # Disabled for the demo: interpolating windows/fades flood the CPU encoder
    # with large full-surface updates and show as smeared stripes on the stream.
    enabled = false
}

dwindle {
    preserve_split = true
}
