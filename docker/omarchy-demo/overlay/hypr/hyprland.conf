# Veragensia Omarchy public demo — Hyprland (X11 backend on Xvfb) + Waybar presenter.
# Derived from the pinned Omarchy revision structure (hypr/ + waybar presenter);
# public-safe: no Focusa daemon connection, no private state, no credentials.

# Presenter: Waybar renders the dated public Work snapshot (public-safe).
exec-once = waybar -c /veragensia/docker/omarchy-demo/overlay/waybar/config.jsonc -s /veragensia/docker/omarchy-demo/overlay/waybar/style.css

# Consumer: Focusa Chrome extension start page (identical flags/mount path = identical extension identity).
# Ozone auto selects the Wayland backend under Hyprland.
exec-once = /usr/lib/chromium/chromium --show-component-extension-options --enable-gpu-rasterization --no-default-browser-check --disable-pings --media-router=0 --disable-dev-shm-usage --enable-remote-extensions --no-sandbox --ozone-platform-hint=auto --user-data-dir=/config/.config/chromium-uiai --load-extension=/extroot/dist --disable-extensions-except=/extroot/dist --remote-debugging-port=9333 --remote-debugging-address=127.0.0.1 --no-first-run --no-default-browser-check --window-size=1280,760 --window-position=150,90 about:blank

# Terminal for operator-side diagnostics (public demo only).
exec-once = foot

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(c4b5fdee) rgba(8b7ec8ee) 45deg
    col.inactive_border = rgba(3a3550aa)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = true
    bezier = veragens,0.05,0.9,0.1,1.05
    animation = windows,1,4,veragens,pop
    animation = fade,1,6,default
}

dwindle {
    pseudotile = false
    preserve_split = true
}
